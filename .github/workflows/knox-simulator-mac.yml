name: Knox simulator Mac E2E
on:
  pull_request:
    branches:
      - arena/019fbcfb-zero-export
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: knox-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  knox-e2e:
    name: Backend tests, Modbus TCP and UI build (self-hosted Mac)
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 30
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Node.js runtime
        shell: bash
        run: |
          node --version
          npm --version
          node -e "if (Number(process.versions.node.split('.')[0]) < 20) process.exit(1)"
      - name: Install backend locked dependencies
        run: npm ci --prefix backend --no-audit --no-fund
      - name: Backend lint and all tests
        run: npm run check --prefix backend
      - name: Explicit Knox TCP integration test
        run: node --test backend/tests/knox-simulator.test.js
      - name: Install frontend locked dependencies
        run: npm ci --prefix frontend --no-audit --no-fund
      - name: Build production UI
        run: npm run build --prefix frontend
